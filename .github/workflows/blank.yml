name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release zip
        run: |
          curl -L -o game.zip https://github.com/iannolavarria-svg/spacebox-game/releases/latest/download/spacebox.zip
          unzip game.zip
          ls -la

      - name: Show folder contents
        run: find . -maxdepth 2 -type d
