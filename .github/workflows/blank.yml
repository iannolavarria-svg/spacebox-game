name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk autoconf automake libtool
          pip3 install buildozer==1.4.0 cython==0.29.33

      - name: Download and extract zip
        run: |
          curl -L -o game.zip https://github.com/iannolavarria-svg/spacebox-game/releases/latest/download/spacebox.zip
          unzip -o game.zip

      - name: Patch buildozer.spec
        run: |
          sed -i 's/^requirements.*/requirements = python3==3.10.14,pygame==2.1.4/' buildozer.spec
          cat buildozer.spec | grep requirements

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log || true

      - name: Show error
        if: always()
        run: grep -i "error\|exception\|fatal" build.log | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: bin/*.apk
      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null
