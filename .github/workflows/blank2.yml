name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk autoconf automake libtool pkg-config
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0 cython==0.29.36

      # 🧹 Limpiar build anterior
      - name: Clean buildozer
        run: rm -rf .buildozer

      # 🔍 (Opcional) ver archivos para confirmar que está todo
      - name: Debug files
        run: ls -R

      # 🔨 Build APK usando TU spec sin modificar
      - name: Build APK
        run: buildozer -v android debug

      # 🔍 Buscar APK generado
      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null

      # 📦 Subir APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: "**/*.apk"
