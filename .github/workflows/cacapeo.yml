name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk autoconf automake libtool pkg-config
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0 cython==0.29.36

      # 🧹 MUY IMPORTANTE
      - name: Clean buildozer
        run: rm -rf .buildozer

      - name: Download and extract zip
        run: |
          curl -L -o game.zip https://github.com/iannolavarria-svg/spacebox-game/releases/latest/download/spacebox.zip
          unzip -o game.zip

      - name: Show files (debug)
        run: ls -R

      - name: Build APK
        run: buildozer -v android debug

      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: "**/*.apk"
