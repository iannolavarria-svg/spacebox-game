name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk
          pip3 install buildozer cython
      - name: Download and extract zip
        run: |
          curl -L -o game.zip https://github.com/iannolavarria-svg/spacebox-game/releases/latest/download/spacebox.zip
          unzip -o game.zip
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spacebox-apk
          path: bin/*.apk
